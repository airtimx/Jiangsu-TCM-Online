spring:
  application:
    name: jiangsu-tcm-online
  # 方案 B：默认使用 tcm/tcm123456（见 database/mysql/init_tcm_user_navicat.sql）
  # 若需 root 开发，IDEA Active profiles 填 local，并复制 application-local.yml.example
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/tcm_online?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USER:tcm}
    password: ${MYSQL_PASSWORD:tcm123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.jiangsu.tcm.module
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
      # Actuator 不走 WebMvc CORS，需在此单独配置（官网/管理端 dev 联调）
      cors:
        allowed-origin-patterns: "http://localhost:*,http://127.0.0.1:*"
        allowed-methods: GET,OPTIONS
        allowed-headers: "*"
  endpoint:
    health:
      show-details: when_authorized

tcm:
  wx:
    mode: ${WX_MODE:mock}
    app-id: ${WX_APP_ID:}
    app-secret: ${WX_APP_SECRET:}
  sms:
    mode: ${SMS_MODE:mock}
    mock-code: ${SMS_MOCK_CODE:123456}
  jwt:
    secret: ${JWT_SECRET:jiangsu-tcm-online-dev-jwt-secret-key-32bytes-min}
    access-token-minutes: ${JWT_ACCESS_MINUTES:120}
    refresh-token-days: ${JWT_REFRESH_DAYS:7}
  oss:
    endpoint: ${OSS_ENDPOINT:http://127.0.0.1:9000}
    bucket: ${OSS_BUCKET:tcm-online}
    access-key: ${OSS_ACCESS_KEY:minioadmin}
    secret-key: ${OSS_SECRET_KEY:minioadmin}
    env: ${OSS_ENV:dev}
    presign-expire-seconds: ${OSS_PRESIGN_EXPIRE_SECONDS:3600}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs

logging:
  level:
    root: INFO
    com.jiangsu.tcm: DEBUG
