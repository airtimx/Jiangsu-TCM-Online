# 江苏中医在线 — 本地开发依赖（模块 00）
# 使用：docker compose up -d

services:
  mysql:
    image: mysql:8.0.36
    container_name: tcm-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: tcm_online
      MYSQL_USER: tcm
      MYSQL_PASSWORD: tcm123456
    ports:
      - "3306:3306"
    volumes:
      - tcm-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: tcm-redis
    ports:
      - "6379:6379"
    volumes:
      - tcm-redis-data:/data

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: tcm-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - tcm-minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2024-12-18T13-15-44Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/tcm-online || true;
      mc anonymous set download local/tcm-online;
      exit 0;
      "

volumes:
  tcm-mysql-data:
  tcm-redis-data:
  tcm-minio-data:
