name: java-api-ci

on:
  push:
    paths:
      - 'jiangsu-tcm-api/**'
      - '.github/workflows/java-api-ci.yml'
  pull_request:
    paths:
      - 'jiangsu-tcm-api/**'

defaults:
  run:
    working-directory: jiangsu-tcm-api

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test
        run: mvn -B clean install
